<!DOCTYPE html> 
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>संपत्ती आणि वित्तीय साक्षरता चॅटबॉट</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Noto Sans Devanagari', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .chat-header h1 { font-size: 1.5rem; margin-bottom: 5px; }
        .chat-header p { opacity: 0.9; font-size: 0.9rem; }
        .status-indicator {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            align-items: center;
            font-size: 0.8rem;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: #ef4444; animation: pulse 2s infinite; }
        .status-dot.ready { background: #10b981; }
        @keyframes pulse { 0%,100% {opacity:1;} 50% {opacity:0.5;} }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; word-wrap: break-word; line-height: 1.4; }
        .user-message { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot-message { background: #f1f5f9; color: #334155; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; }
        .error-message { background: #fee2e2; color: #dc2626; align-self: center; text-align: center; border: 1px solid #fecaca; }
        .welcome-message { background: linear-gradient(135deg, #10b981, #059669); color: white; align-self: center; text-align: center; margin-bottom: 20px; }
        .chat-input-container { padding: 20px; background: white; border-top: 1px solid #e2e8f0; }
        .chat-input-form { display: flex; gap: 10px; align-items: center; }
        .chat-input { flex: 1; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 25px; outline: none; font-size: 1rem; transition: border-color 0.3s ease; }
        .chat-input:focus { border-color: #4f46e5; }
        .chat-input::placeholder { color: #94a3b8; }
        .send-button { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s ease; }
        .send-button:hover { transform: scale(1.05); }
        .send-button:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
        .loading { display: flex; align-items: center; gap: 8px; color: #64748b; font-style: italic; }
        .loading-dots { display: flex; gap: 2px; }
        .loading-dot { width: 4px; height: 4px; border-radius: 50%; background: #64748b; animation: loading 1.4s infinite ease-in-out both; }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes loading { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }
        .sample-questions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .sample-question { background: rgba(79,70,229,0.1); color: #4f46e5; padding: 8px 12px; border-radius: 15px; cursor: pointer; font-size: 0.9rem; border: 1px solid rgba(79,70,229,0.2); transition: all 0.3s ease; }
        .sample-question:hover { background: rgba(79,70,229,0.2); transform: translateY(-2px); }
        @media (max-width: 768px) {
            .chat-container { width: 95%; height: 90vh; border-radius: 15px; }
            .message { max-width: 90%; }
            .chat-header h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">लोड होत आहे...</span>
            </div>
            <h1>💰 वित्तीय साक्षरता चॅटबॉट</h1>
            <p>बँकिंग, गुंतवणूक आणि बचतीसंबंधी प्रश्न विचारा</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message welcome-message">
                <strong>नमस्कार! 🙏</strong><br>
                मी तुमचा वित्तीय सल्लागार आहे. तुम्ही मला बँकिंग, बचत, गुंतवणूक, डिजिटल पेमेंट्स आणि आर्थिक नियोजन याबद्दल कोणताही प्रश्न विचारू शकता.
                
                <div class="sample-questions">
                    <div class="sample-question" onclick="askSampleQuestion('बँक खाते उघडण्यासाठी काय आवश्यक आहे?')">
                        बँक खाते
                    </div>
                    <div class="sample-question" onclick="askSampleQuestion('म्युच्युअल फंड म्हणजे काय?')">
                        म्युच्युअल फंड
                    </div>
                    <div class="sample-question" onclick="askSampleQuestion('सुरक्षित गुंतवणूक कशी करावी?')">
                        गुंतवणूक
                    </div>
                    <div class="sample-question" onclick="askSampleQuestion('डिजिटल पेमेंट सुरक्षित कसे करायचे?')">
                        डिजिटल पेमेंट
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-input-container">
            <form class="chat-input-form" onsubmit="sendMessage(event)">
                <input type="text" class="chat-input" id="messageInput" placeholder="तुमचा प्रश्न येथे लिहा..." autocomplete="off" disabled>
                <button type="submit" class="send-button" id="sendButton" disabled>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        let isLoading = false;

        async function checkStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                updateStatus(data.ready_for_chat, data.message);
                if (data.ready_for_chat) {
                    document.getElementById('messageInput').disabled = false;
                    document.getElementById('sendButton').disabled = false;
                }
            } catch (error) {
                console.error('Status check error:', error);
                updateStatus(false, 'कनेक्शन त्रुटी');
            }
        }

        function updateStatus(ready, message) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            if (ready) {
                statusDot.classList.add('ready');
                statusText.textContent = 'तयार';
            } else {
                statusDot.classList.remove('ready');
                statusText.textContent = message || 'लोड होत आहे...';
            }
        }

        function addMessage(content, type) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            messageDiv.innerHTML = content;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addLoadingMessage() {
            const messagesContainer = document.getElementById('chatMessages');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot-message loading';
            loadingDiv.id = 'loadingMessage';
            loadingDiv.innerHTML = `
                <span>उत्तर तयार करत आहे</span>
                <div class="loading-dots">
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                </div>
            `;
            messagesContainer.appendChild(loadingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeLoadingMessage() {
            const loadingMessage = document.getElementById('loadingMessage');
            if (loadingMessage) { loadingMessage.remove(); }
        }

        async function sendMessage(event) {
            event.preventDefault();
            if (isLoading) return;
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            if (!message) return;
            addMessage(message, 'user');
            messageInput.value = '';
            isLoading = true;
            document.getElementById('sendButton').disabled = true;
            addLoadingMessage();
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                removeLoadingMessage();
                if (data.status === 'success') {
                    addMessage(data.answer, 'bot');
                } else {
                    addMessage(data.error || 'काही त्रुटी झाली', 'error');
                }
            } catch (error) {
                removeLoadingMessage();
                addMessage('सर्व्हरशी कनेक्शन झाले नाही. कृपया पुन्हा प्रयत्न करा.', 'error');
                console.error('Chat error:', error);
            }
            isLoading = false;
            document.getElementById('sendButton').disabled = false;
        }

        function askSampleQuestion(question) {
            const messageInput = document.getElementById('messageInput');
            messageInput.value = question;
            messageInput.focus();
        }

        document.addEventListener('DOMContentLoaded', function() {
            const messageInput = document.getElementById('messageInput');
            messageInput.addEventListener('keypress', function(event) {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    if (!isLoading && !this.disabled) { sendMessage(event); }
                }
            });
            checkStatus();
            const statusInterval = setInterval(() => {
                checkStatus().then(() => {
                    const sendButton = document.getElementById('sendButton');
                    if (!sendButton.disabled) { clearInterval(statusInterval); }
                });
            }, 2000);
        });
    </script>
</body>
</html>
